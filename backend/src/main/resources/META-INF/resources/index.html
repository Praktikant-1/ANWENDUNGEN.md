<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EXPass</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: black;
            color: white;
        }
        h1 {
            color: darkorange;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
            margin: 0 auto;
            text-align: left;
        }
        #code-bereich[hidden] {
            display: none;
        }
        .login {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 16px;
            color: black;
            background-color: darkorange;
            text-decoration: none;
        }
    </style>
</head>
<body>
<h1>EXPass – Visitor Management</h1>

<h2>Request a visit</h2>
<form id="antrag-formular">
    <input name="name" placeholder="Name" required>
    <input name="email" type="email" placeholder="E-mail" required>
    <input name="firma" placeholder="Company (optional)">
    <input name="grund" placeholder="Reason for visit" required>
    <label>From <input name="von" type="date" required></label>
    <label>Until <input name="bis" type="date" required></label>
    <button type="submit">Send request</button>
</form>
<p id="meldung"></p>

<form id="code-bereich" hidden>
    <p id="countdown"></p>
    <input name="code" placeholder="6-digit code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
    <button type="submit">Confirm</button>
    <button type="button" id="code-erneut">Send code again</button>
</form>

<h2>Staff</h2>
<a class="login" href="/login/">Log in</a>

<script>
    const heute = new Date().toISOString().slice(0, 10);
    const von = document.querySelector('[name="von"]');
    const bis = document.querySelector('[name="bis"]');
    von.min = heute;
    bis.min = heute;
    von.addEventListener('change', () => bis.min = von.value || heute);

    // Muss zu MailService.VERZOEGERUNG_SEKUNDEN passen
    const VERZOEGERUNG_SEKUNDEN = 30;
    const meldung = document.getElementById('meldung');
    const codeBereich = document.getElementById('code-bereich');
    const countdown = document.getElementById('countdown');
    let email = null;
    let timer = null;

    // Startet bei jeder neuen Anfrage von vorn, genau wie das Debouncing im Backend
    function starteCountdown() {
        let rest = VERZOEGERUNG_SEKUNDEN;
        clearInterval(timer);
        const anzeigen = () => {
            countdown.textContent = rest > 0
                ? `A confirmation code will be sent to ${email} in ${rest} s.`
                : `Code sent to ${email}. It is valid for 10 minutes.`;
        };
        anzeigen();
        timer = setInterval(() => {
            rest--;
            anzeigen();
            if (rest <= 0) clearInterval(timer);
        }, 1000);
        codeBereich.hidden = false;
    }

    document.getElementById('antrag-formular').addEventListener('submit', async (event) => {
        event.preventDefault();

        const daten = Object.fromEntries(new FormData(event.target));

        const antwort = await fetch('/antraege', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(daten)
        });

        if (antwort.ok) {
            meldung.textContent = 'Request sent. Please confirm your e-mail address.';
            email = daten.email;
            event.target.reset();
            starteCountdown();
        } else {
            meldung.textContent = 'Error: request could not be sent.';
        }
    });

    document.getElementById('code-erneut').addEventListener('click', async () => {
        await fetch('/antraege/code-senden', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        starteCountdown();
    });

    codeBereich.addEventListener('submit', async (event) => {
        event.preventDefault();
        const code = new FormData(event.target).get('code');

        const antwort = await fetch('/antraege/bestaetigen', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
        });

        if (antwort.ok) {
            clearInterval(timer);
            event.target.reset();
            codeBereich.hidden = true;
            meldung.textContent = 'E-mail confirmed. Your request will now be reviewed.';
        } else {
            meldung.textContent = 'Wrong or expired code.';
        }
    });
</script>
</body>
</html>
