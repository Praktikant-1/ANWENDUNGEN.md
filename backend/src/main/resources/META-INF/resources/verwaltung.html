<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EXPass</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: black;
            color: white;

        }
        h1 {
            color: darkorange;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid white;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
<h1>EXPass – Visitor Management</h1>

<h2>Add visitor</h2>
<form id="besucher-formular">
    <input name="name" placeholder="Name" required>
    <input name="firma" placeholder="Company">
    <input name="grund" placeholder="Reason for visit">
    <input name="ankunft" type="time">
    <button type="submit">Add</button>
    <button type="button" id="jetzt">Now</button>

</form>

<p id="meldung"></p>

<h2>Requests</h2>
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Company</th>
        <th>Reason</th>
        <th>From</th>
        <th>Until</th>
        <th>Status</th>
        <th></th>
    </tr>
    </thead>
    <tbody id="antrag-tabelle"></tbody>
</table>

<h2>Visitors</h2>
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Company</th>
        <th>Reason</th>
        <th>Arrival</th>
    </tr>
    </thead>
    <tbody id="besucher-tabelle"></tbody>
</table>

<script>
    async function ladeBesucher() {
        const antwort = await fetch('/besucher');
        const besucherListe = await antwort.json();

        const tabelle = document.getElementById('besucher-tabelle');
        tabelle.innerHTML = '';

        if (besucherListe.length === 0) {
            tabelle.innerHTML = '<tr><td colspan="4">No visitors yet.</td></tr>';
            return;
        }

        for (const besucher of besucherListe) {
            const zeile = document.createElement('tr');
            for (const wert of [besucher.name, besucher.firma, besucher.grund, besucher.ankunft]) {
                const zelle = document.createElement('td');
                zelle.textContent = wert ?? '';
                zeile.appendChild(zelle);
            }
            tabelle.appendChild(zeile);
        }
    }

    document.getElementById('besucher-formular').addEventListener('submit', async (event) => {
        event.preventDefault();
        const meldung = document.getElementById('meldung');

        const daten = Object.fromEntries(new FormData(event.target));
        if (!daten.ankunft) delete daten.ankunft;

        const antwort = await fetch('/besucher', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(daten)
        });

        if (antwort.ok) {
            meldung.textContent = 'Visitor added.';
            event.target.reset();
            ladeBesucher();
        } else {
            meldung.textContent = 'Error: visitor could not be saved.';
        }
    });

    ladeBesucher();

    const statusText = { OFFEN: 'Open', ANGENOMMEN: 'Accepted', ABGELEHNT: 'Rejected' };

    async function ladeAntraege() {
        const antwort = await fetch('/antraege');
        const antraege = await antwort.json();

        const tabelle = document.getElementById('antrag-tabelle');
        tabelle.innerHTML = '';

        if (antraege.length === 0) {
            tabelle.innerHTML = '<tr><td colspan="7">No requests yet.</td></tr>';
            return;
        }

        for (const antrag of antraege) {
            const zeile = document.createElement('tr');
            for (const wert of [antrag.name, antrag.firma, antrag.grund, antrag.von, antrag.bis, statusText[antrag.status]]) {
                const zelle = document.createElement('td');
                zelle.textContent = wert ?? '';
                zeile.appendChild(zelle);
            }

            const aktionen = document.createElement('td');
            if (antrag.status === 'OFFEN') {
                for (const [text, aktion] of [['Accept', 'annehmen'], ['Reject', 'ablehnen']]) {
                    const knopf = document.createElement('button');
                    knopf.textContent = text;
                    knopf.addEventListener('click', async () => {
                        await fetch(`/antraege/${antrag.id}/${aktion}`, { method: 'POST' });
                        ladeAntraege();
                    });
                    aktionen.appendChild(knopf);
                }
            }
            zeile.appendChild(aktionen);
            tabelle.appendChild(zeile);
        }
    }

    ladeAntraege();

    document.getElementById('jetzt').addEventListener('click', () => {
              document.querySelector('[name="ankunft"]').value =
                  new Date().toTimeString().slice(0, 5);
          });
</script>
</body>
</html>
