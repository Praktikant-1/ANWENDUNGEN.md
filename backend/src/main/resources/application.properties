# Im Dev-Modus auf allen Netzwerkadressen lauschen, damit die Seite auch vom Handy im WLAN erreichbar ist
%dev.quarkus.http.host=0.0.0.0

# Formular-Login (die Benutzer verwaltet AccountService)
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login/
quarkus.http.auth.form.error-page=/login/?fehler
# Nach dem Login: Verwaltung -> verwaltung.html, Mitarbeiter -> mitarbeiter.html
quarkus.http.auth.form.landing-page=/nach-login

# Verwaltungsseite nur für die Verwaltung
quarkus.http.auth.policy.nur-verwaltung.roles-allowed=verwaltung
quarkus.http.auth.permission.verwaltung.paths=/verwaltung.html
quarkus.http.auth.permission.verwaltung.policy=nur-verwaltung

# Schaden melden nur für Mitarbeiter
quarkus.http.auth.policy.nur-mitarbeiter.roles-allowed=mitarbeiter
quarkus.http.auth.permission.mitarbeiter.paths=/mitarbeiter.html
quarkus.http.auth.permission.mitarbeiter.policy=nur-mitarbeiter

# Accountverwaltung nur für Admins
quarkus.http.auth.policy.nur-admin.roles-allowed=admin
quarkus.http.auth.permission.accounts.paths=/accounts.html
quarkus.http.auth.permission.accounts.policy=nur-admin

# Seiten nicht im Browser zwischenspeichern, sonst sieht man nach Logout oder Code-Änderungen alte/geschützte Seiten
quarkus.http.filter.kein-cache.header."Cache-Control"=no-store
quarkus.http.filter.kein-cache.matches=/.*

# E-Mail: im Dev-Modus werden Mails nicht verschickt, sondern im Quarkus-Log angezeigt
quarkus.mailer.from=noreply@expass.local
# Hierhin geht die Benachrichtigung bei neuen Besuchsanträgen
expass.verwaltung.email=verwaltung@expass.local

# Datenbank: im Dev-Modus startet Quarkus PostgreSQL automatisch in Docker (Dev Services)
quarkus.datasource.db-kind=postgresql
# Tabellen aus den @Entity-Klassen anlegen bzw. ergänzen, vorhandene Daten bleiben erhalten
%dev.quarkus.hibernate-orm.schema-management.strategy=update

quarkus.oidc.application-type=web-app
quarkus.oidc.logout.path=/oidc-logout
quarkus.oidc.logout.post-logout-path=/

%dev.quarkus.keycloak.devservices.users.LeonhardKlotz=leo123
%dev.quarkus.keycloak.devservices.users.Nicole=nicole123
%dev.quarkus.keycloak.devservices.users.Markus=markus123
%dev.quarkus.keycloak.devservices.users.gast=gast123

quarkus.http.auth.permission.oidc-login.paths=/login-oidc
quarkus.http.auth.permission.oidc-login.policy=authenticated
quarkus.http.auth.permission.oidc-login.auth-mechanism=code

quarkus.http.auth.form.priority=2000

%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:besucherverwaltung}
%prod.quarkus.oidc.credentials.secret=${OIDC_SECRET}
