<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="login.seitentitel">EXPass – Login</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
            margin: 0 auto;
            text-align: left;
        }
        #fehler {
            color: red;
        }
    </style>
</head>
<body>
<div class="sprachwahl oben-rechts"></div>
<h1 data-i18n="login.seitentitel">EXPass – Login</h1>

<p id="fehler" hidden data-i18n="login.fehler">Username or password is wrong.</p>

<form action="/j_security_check" method="post">
    <input name="j_username" placeholder="Username" data-i18n-placeholder="feld.benutzername" required>
    <input name="j_password" type="password" placeholder="Password" data-i18n-placeholder="feld.passwort" required>
    <button type="submit" data-i18n="login.knopf">Log in</button>
</form>

<p><a href="/" data-i18n="login.zurueck">Back to start page</a></p>

<script src="/sprache.js"></script>
<script>
    // Quarkus merkt sich die Seite, die man vor dem Login öffnen wollte, und schickt einen danach dorthin.
    // Das löschen wir, damit jeder über /nach-login auf seiner eigenen Seite landet
    // (sonst landet z. B. ein Mitarbeiter auf verwaltung.html und bekommt 403).
    document.cookie = 'quarkus-redirect-location=; Max-Age=0; path=/';

    if (location.search.includes('fehler')) {
        document.getElementById('fehler').hidden = false;
    }
</script>
</body>
</html>
