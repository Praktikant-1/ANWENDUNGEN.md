<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="schaden.seitentitel">EXPass – Report damage</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        #schaden-formular {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
            margin: 0 auto;
            text-align: left;
        }
        .logout {
            padding: 8px 16px;
            color: black;
            background-color: darkorange;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="sprachwahl oben-rechts"></div>
<h1 data-i18n="schaden.seitentitel">EXPass – Report damage</h1>

<form action="/logout" method="post">
    <button type="submit" class="logout" data-i18n="abmelden">Log out</button>
</form>

<h2 data-i18n="schaden.titel">Report damage</h2>
<form id="schaden-formular">
    <textarea name="beschreibung" rows="4" placeholder="What is damaged? Where?" data-i18n-placeholder="schaden.beschreibung" required></textarea>
    <label><span data-i18n="spalte.datum">Date</span> <input name="datum" type="date" required></label>
    <input name="verursacher" placeholder="Caused by (only if confessed)" data-i18n-placeholder="schaden.verursacher">
    <button type="submit" data-i18n="schaden.senden">Send report</button>
</form>
<p id="meldung"></p>

<script src="/sprache.js"></script>
<script>
    const datum = document.querySelector('[name="datum"]');
    const heute = new Date().toLocaleDateString('sv'); // Format JJJJ-MM-TT
    datum.max = heute;
    datum.value = heute;

    document.getElementById('schaden-formular').addEventListener('submit', async (event) => {
        event.preventDefault();
        const meldung = document.getElementById('meldung');

        const daten = Object.fromEntries(new FormData(event.target));
        if (!daten.verursacher) delete daten.verursacher;

        const antwort = await fetch('/schaeden', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(daten)
        });
        // Nicht (mehr) eingeloggt: Quarkus leitet auf die Login-Seite um
        if (antwort.redirected) {
            location.href = '/login/';
            return;
        }

        if (antwort.ok) {
            meldung.textContent = t('schaden.danke');
            event.target.reset();
            datum.value = heute;
        } else {
            meldung.textContent = t('schaden.fehler');
        }
    });
</script>
</body>
</html>
