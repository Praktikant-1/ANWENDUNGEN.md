<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="accounts.seitentitel">EXPass – Accounts</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        a {
            color: darkorange;
        }
        #account-formular {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
            margin: 0 auto;
            text-align: left;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid white;
            padding: 8px 16px;
        }
        /* Suche über der Account-Tabelle */
        .suche {
            margin-bottom: 12px;
        }
        #account-suche {
            width: 280px;
            max-width: 100%;
            padding: 8px 10px;
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            font: inherit;
        }
        #account-suche:focus {
            outline: none;
            border-color: darkorange;
        }
        #account-treffer {
            margin-left: 8px;
            font-size: 0.85em;
            color: #bbb;
        }
    </style>
</head>
<body>
<div class="sprachwahl oben-rechts"></div>
<h1 data-i18n="accounts.seitentitel">EXPass – Accounts</h1>
<p><a href="/verwaltung.html" data-i18n="accounts.zurueck">Back to visitor management</a></p>

<h2 data-i18n="accounts.erstellenTitel">Create account</h2>
<form id="account-formular">
    <input name="benutzername" placeholder="Username" data-i18n-placeholder="feld.benutzername" required>
    <input name="passwort" type="password" placeholder="Password (min. 8 characters)" data-i18n-placeholder="accounts.passwort" minlength="8" required>
    <select name="rolle">
        <option value="MITARBEITER" data-i18n="rolle.MITARBEITER">Employee</option>
        <option value="VERWALTUNG" data-i18n="rolle.VERWALTUNG">Administration</option>
    </select>
    <label><input name="admin" type="checkbox"> <span data-i18n="accounts.adminCheckbox">Admin (only for administration)</span></label>
    <button type="submit" data-i18n="accounts.erstellen">Create</button>
</form>
<p id="meldung"></p>

<h2 data-i18n="accounts.alleTitel">All accounts</h2>
<div class="suche">
    <input type="search" id="account-suche" placeholder="Search accounts…"
           title="Searches username, role and admin. Several words narrow the result, e.g. admin yes"
           data-i18n-placeholder="accounts.suche" data-i18n-title="accounts.sucheTitel">
    <span id="account-treffer"></span>
</div>
<table>
    <thead>
    <tr>
        <th data-i18n="feld.benutzername">Username</th>
        <th data-i18n="spalte.rolle">Role</th>
        <th data-i18n="spalte.admin">Admin</th>
        <th></th>
    </tr>
    </thead>
    <tbody id="account-tabelle"></tbody>
</table>

<script src="/sprache.js"></script>
<script>
    const meldung = document.getElementById('meldung');
    let ich = '';

    // Nicht (mehr) eingeloggt: Quarkus leitet auf die Login-Seite um
    function zumLoginWennAbgelaufen(antwort) {
        if (antwort.redirected) {
            location.href = '/login/';
            return true;
        }
        return false;
    }

    async function zeigeFehler(antwort) {
        const text = await antwort.text();
        meldung.textContent = t('accounts.fehler', { text: text ? tServer(text) : antwort.status });
    }

    async function ladeAccounts() {
        const tabelle = document.getElementById('account-tabelle');
        const antwort = await fetch('/accounts');
        if (zumLoginWennAbgelaufen(antwort)) return;
        if (!antwort.ok) {
            tabelle.innerHTML = `<tr><td colspan="4">${t('accounts.keineRechte')}</td></tr>`;
            return;
        }
        const accounts = await antwort.json();
        // Alphabetisch nach Benutzername, Groß-/Kleinschreibung egal
        accounts.sort((a, b) => a.benutzername.localeCompare(b.benutzername, 'de', { sensitivity: 'base' }));

        tabelle.innerHTML = '';
        for (const account of accounts) {
            const zeile = document.createElement('tr');
            for (const wert of [account.benutzername, t('rolle.' + account.rolle), account.admin ? t('ja') : t('nein')]) {
                const zelle = document.createElement('td');
                zelle.textContent = wert;
                zeile.appendChild(zelle);
            }

            const aktionen = document.createElement('td');
            if (account.benutzername === ich) {
                aktionen.textContent = t('accounts.du');
            } else {
                const knoepfe = [];
                if (account.rolle === 'VERWALTUNG') {
                    knoepfe.push(account.admin
                        ? [t('accounts.adminEntziehen'), 'POST', `/accounts/${encodeURIComponent(account.benutzername)}/admin-entziehen`]
                        : [t('accounts.adminGeben'), 'POST', `/accounts/${encodeURIComponent(account.benutzername)}/admin-geben`]);
                }
                knoepfe.push([t('accounts.loeschen'), 'DELETE', `/accounts/${encodeURIComponent(account.benutzername)}`]);

                for (const [text, methode, url] of knoepfe) {
                    const knopf = document.createElement('button');
                    knopf.textContent = text;
                    knopf.addEventListener('click', async () => {
                        if (methode === 'DELETE' && !confirm(t('accounts.loeschenFrage', { name: account.benutzername }))) return;
                        const antwort = await fetch(url, { method: methode });
                        if (zumLoginWennAbgelaufen(antwort)) return;
                        if (antwort.ok) {
                            meldung.textContent = '';
                        } else {
                            await zeigeFehler(antwort);
                        }
                        ladeAccounts();
                    });
                    aktionen.appendChild(knopf);
                }
            }
            zeile.appendChild(aktionen);
            tabelle.appendChild(zeile);
        }
        sucheAnwenden();
    }

    // Zeigt nur Zeilen, in denen alle Suchwörter vorkommen (Benutzername, Rolle, Admin)
    function sucheAnwenden() {
        const woerter = document.getElementById('account-suche').value.toLowerCase().split(/\s+/).filter(w => w);
        const zeilen = document.querySelectorAll('#account-tabelle tr');
        let treffer = 0;
        for (const zeile of zeilen) {
            const text = [...zeile.cells].slice(0, 3).map(zelle => zelle.textContent).join(' ').toLowerCase();
            const passt = woerter.every(wort => text.includes(wort));
            zeile.hidden = !passt;
            if (passt) treffer++;
        }
        document.getElementById('account-treffer').textContent =
            woerter.length ? (treffer === 1 ? t('treffer.eins') : t('treffer.viele', { n: treffer })) : '';
    }

    document.getElementById('account-suche').addEventListener('input', sucheAnwenden);

    document.getElementById('account-formular').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formular = event.target;
        const daten = {
            benutzername: formular.benutzername.value,
            passwort: formular.passwort.value,
            rolle: formular.rolle.value,
            admin: formular.admin.checked
        };

        const antwort = await fetch('/accounts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(daten)
        });
        if (zumLoginWennAbgelaufen(antwort)) return;

        if (antwort.ok) {
            meldung.textContent = t('accounts.erstellt');
            formular.reset();
            ladeAccounts();
        } else {
            await zeigeFehler(antwort);
        }
    });

    async function start() {
        const antwort = await fetch('/accounts/ich');
        if (zumLoginWennAbgelaufen(antwort)) return;
        if (antwort.ok) {
            ich = (await antwort.json()).benutzername;
        }
        ladeAccounts();
    }

    start();

    // Sprache gewechselt: Tabelle in der neuen Sprache neu aufbauen
    document.addEventListener('sprachwechsel', ladeAccounts);
</script>
</body>
</html>
